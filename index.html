<script>
(() => {
'use strict';
// ---------- Constantes ----------
// Categorías de gasto: se editan en Ajustes. El id no cambia al renombrar (los movimientos guardan el id).
const CATS_DEF = [{id:'Súper', nombre:'Súper', color:'--c-super', dia:true}, {id:'Alimentación', nombre:'Alimentación', color:'--c-ali', dia:true},
  {id:'Salud', nombre:'Salud', color:'--c-salud', dia:true}, {id:'Vestimenta', nombre:'Vestimenta', color:'--c-vest', dia:true},
  {id:'Extras', nombre:'Extras', color:'--c-extras', dia:true}, {id:'Fijos', nombre:'Recurrentes', color:'--c-fijos', dia:false}];
const PALETA = ['#2f9e44','#d9480f','#ae3ec9','#0c8599','#b08900','#8a5a44','#e8590c','#5c940d','#23907f','#c27a1d','#c2456b','#5b6fd6'];
const CATS = () => S.cfg.cats && S.cfg.cats.length ? S.cfg.cats : CATS_DEF;
const CAT = id => CATS().find(c => c.id === id);
const nomCat = id => CAT(id)?.nombre || id || '';
const colCat = id => { const c = CAT(id)?.color || '--c-fijos'; return c.startsWith('--') ? `var(${c})` : c; };
const colCatRes = id => { const c = CAT(id)?.color || '--c-fijos'; return c.startsWith('--') ? getComputedStyle(document.documentElement).getPropertyValue(c).trim() : c; };
const catsVariables = () => CATS().filter(c => c.dia).map(c => c.id); // las del presupuesto del día a día
// Subcategorías de los gastos recurrentes: se asignan en cada gasto recurrente (Ajustes). 'conceptos' agrupa los de la planilla y los cargados a mano.
const SIN_SUB = {id:'_sin', nombre:'Sin subcategoría', color:'--c-fijos', conceptos:[]};
const SUBS = () => S.cfg.subs || [];
const SUB = id => SUBS().find(x => x.id === id);
const colSub = x => { const c = x.color || '--c-fijos'; return c.startsWith('--') ? `var(${c})` : c; };
const colSubRes = x => { const c = x.color || '--c-fijos'; return c.startsWith('--') ? getComputedStyle(document.documentElement).getPropertyValue(c).trim() : c; };
function subIndice(){ // concepto normalizado → subcategoría
  const idx = {}, tpl = {};
  for (const x of SUBS()) for (const c of x.conceptos || []) idx[claveConcepto(c)] = x.id;
  for (const p of S.plant) if (p.tipo === 'gasto'){ tpl[claveConcepto(p.nombre)] = p; if (p.sub) idx[claveConcepto(p.nombre)] = p.sub; }
  return {idx, tpl};
}
// ¿Es un gasto recurrente? Devuelve su subcategoría o null
function subDe(m, I){
  if (m.tipo !== 'gasto' || m.estado === 'omitido') return null;
  const p = m.plantilla ? S.plant.find(x => x.id === m.plantilla) : null;
  if (p && p.tipo === 'gasto') return SUB(p.sub) ? p.sub : SIN_SUB.id;
  const k = claveConcepto(m.concepto);
  if (m.cat !== 'Fijos' && !I.tpl[k]) return null;
  return SUB(I.idx[k]) ? I.idx[k] : SIN_SUB.id;
}

const TIPOS = {gasto:'Gasto', ingreso:'Ingreso', mover:'Transferir', pago:'Pagar tarjeta'};

// Mes en que se paga una compra con tarjeta, según el cierre y el vencimiento de esa tarjeta.
// Si vence después del cierre en el mismo mes (cierra el 3, vence el 15): lo comprado hasta el cierre se paga ese mes.
// Si vence el mes siguiente (cierra el 28, vence el 10): lo comprado hasta el cierre se paga el mes siguiente.
function mesPago(m){
  const base = mesDe(m.fecha), t = TJ(m.tarjeta) || {};
  const cierre = +t.cierre || 0, venc = +t.vence || 0;
  const cierreMes = cierre && Number(String(m.fecha).slice(8,10)) > cierre ? addMes(base, 1) : base;
  return venc && cierre && venc > cierre ? cierreMes : addMes(cierreMes, 1);
}
// La compra se lista en el mes anterior al que se paga (lo de este mes se paga el mes que viene)
function mesResumen(m){
  if (m.mesResumen) return m.mesResumen;
  if (!isCard(m)) return mesDe(m.fecha);
  if (m.plantilla) return mesDe(m.fecha); // un recurrente con tarjeta se cobra en el resumen del mes al que corresponde
  return addMes(mesPago(m), -1);
}

// Los ítems de la planilla usan medio (Débito, BROU, OCA, PLAT, Tarjeta) y cuenta por nombre; se pasan al formato de la app
const HIST = {cuenta:{Débito:'itau', Efectivo:'itau', BROU:'brou'}, tarjeta:{OCA:'oca', PLAT:'plat', Tarjeta:'Tarjeta'}, ahorro:{BROU:'brou', BHU:'bhu'}};
const MEDIO_DE = {tarjeta: Object.fromEntries(Object.entries(HIST.tarjeta).map(([k,v]) => [v,k])), cuenta:{itau:'Débito', brou:'BROU'}};
function planAMov(it, mk, i){
  const fecha = it.fecha && mesDe(it.fecha) === mk ? it.fecha : `${mk}-01`;
  const tasa = it.moneda === 'USD' ? (+it.tc || tasaDe('USD')) : it.moneda === 'UI' ? (+it.ui || S.plan[mk]?.ui || tasaDe('UI')) : 1;
  const m = {id:`pl:${mk}:${i}`, pl:{mk, idx:i}, fecha, tipo:it.tipo, cat:it.cat, concepto:it.concepto, monto:+it.monto || 0, moneda:it.moneda, tasa, cuotas:1, estado:'pagado', nota:it.nota || '', total:it.total};
  if (it.tipo === 'ahorro'){
    const c = HIST.ahorro[it.cuenta] || it.cuenta || 'brou';
    Object.assign(m, {tipo:'mover', cat:'Transferencia', de: it.dir === 'ret' ? c : 'itau', a: it.dir === 'ret' ? 'itau' : c, monA:it.moneda, montoA:m.monto, modo: it.dir === 'ret' ? 'ret' : 'dep'});
  } else if (it.tipo === 'gasto' && HIST.tarjeta[it.medio]){ m.tarjeta = HIST.tarjeta[it.medio]; m.mesResumen = mk; }
  else if (it.tipo === 'pago'){ m.tarjeta = HIST.tarjeta[it.medio] || it.medio; m.cuenta = 'itau'; }
  else m.cuenta = HIST.cuenta[it.medio] || 'itau';
  return m;
}
// Vuelve a escribir un movimiento como ítem de la planilla
function movAPlan(d, old){
  const it = {tipo:d.tipo, cat:d.cat, concepto:d.concepto, monto:d.monto, moneda:d.moneda, nota:d.nota || '', fecha:d.fecha};
  if (d.moneda !== monP().id) it[d.moneda === 'UI' ? 'ui' : 'tc'] = d.tasa;
  if (d.tipo === 'mover'){
    const ret = !esDia(d.de) && esDia(d.a), c = ret ? d.de : d.a;
    Object.assign(it, {tipo:'ahorro', cat:'Ahorro', medio:'Débito', cuenta: Object.entries(HIST.ahorro).find(([,v]) => v === c)?.[0] || nomCta(c), dir: ret ? 'ret' : 'dep'});
  } else if (d.tarjeta){ it.medio = MEDIO_DE.tarjeta[d.tarjeta] || nomTj(d.tarjeta); if (d.tipo === 'gasto') it.total = old && old.total != null && Math.abs(old.total - old.monto) > 0.5 ? old.total : d.monto; }
  else it.medio = MEDIO_DE.cuenta[d.cuenta] || 'Débito';
  return it;
}
async function guardarEnPlanilla(mk, idx, item){ // item null = borrar
  const doc = S.plan[mk];
  if (!doc){ toast('La app empieza en ' + nombreMes(inicio()).toLowerCase()); return false; }
  const items = (doc.items || []).map(x => ({...x}));
  if (item === null) items.splice(idx, 1); else if (idx == null) items.push(item); else items[idx] = item;
  try { await S.db.doc('planilla/' + mk).update({items}); return true; }
  catch(e){ toast('No se pudo guardar. Probá de nuevo.'); return false; }
}

// ---------- Cálculos ----------
function itemsDelMes(mk){
  const out = [];
  if (mk < inicio()){
    const p = S.plan[mk];
    if (p && Array.isArray(p.items)) p.items.forEach((it, i) => { const m = planAMov(it, mk, i); out.push({m, uyu: toBase(m), cuota:0, cuotas:1, pl:true}); });
    // compras con tarjeta cargadas en la app que entran en un resumen anterior al primer mes (se pagan en el primer mes)
    if (!p) for (const m of S.movs){ if (m.estado === 'omitido' || !isCard(m) || m.previo) continue; const n = Math.max(1, m.cuotas|0 || 1), i = difMes(mk, mesResumen(m)); if (i >= 0 && i < n) out.push({m, uyu: toBase(m)/n, cuota: n > 1 ? i+1 : 0, cuotas: n}); }
    return out;
  }
  for (const m of S.movs){
    if (m.estado === 'omitido') continue;
    if (m.evento && (m.ajeno || pagoOtro(m))) continue; // lo pagó otra persona en un viaje o salida: se ve solo ahí
    if (m.viatico) continue; // pagado con los viáticos del viaje: ya salió del mes cuando cargaste los viáticos
    if (m.carga && m.aportePor) continue; // viáticos que puso otra persona: no sale de tus cuentas
    const n = Math.max(1, m.cuotas|0 || 1);
    if (isCard(m)){
      const i = difMes(mk, mesResumen(m));
      if (i >= 0 && i < n) out.push({m, uyu: toBase(m)/n, cuota: n > 1 ? i+1 : 0, cuotas: n});
    } else if (n > 1 && pagoOtro(m)){ // lo pagó otra persona en cuotas: una por mes desde el mes en que empieza a pagarse
      const i = difMes(mk, m.inicioCuotas || mesDe(m.fecha));
      if (i >= 0 && i < n) out.push({m, uyu: toBase(m)/n, cuota: i+1, cuotas: n});
    } else if (mesDe(m.fecha) === mk){
      out.push({m, uyu: toBase(m), cuota: 0, cuotas: 1});
    }
  }
  return out;
}
const bhuPesos = () => 0; // sin cuota descontada del sueldo
// ---------- Descuentos de un ingreso (préstamo, cuota, aporte que te descuentan del sueldo) ----------
// Un gasto recurrente con "descuentaDe" = id de un ingreso recurrente. Al cobrar ese ingreso por el neto, la app

// Compatibilidad: en la versión personal el BHU venía marcado con esBHU (gasto) y bhu (sueldo), con la cuota en cfg.bhuUI.
const descuentaDe = p => p.descuentaDe || (p.esBHU ? (S.plant.find(x => x.tipo === 'ingreso' && x.bhu) || {}).id || null : null);
const valorDesc = p => (p.esBHU && !p.descuentaDe && +S.cfg.bhuUI && S.cfg.monedas.some(m => m.id === 'UI')) ? {monto:+S.cfg.bhuUI, moneda:'UI'} : {monto:+p.monto || 0, moneda:p.moneda};

const descOmitido = (d, mk) => !!mk && S.movs.some(m => m.plantilla === d.id && mesDe(m.fecha) === mk && m.estado === 'omitido');

async function asegurarDescuentos(pid, mk, fecha, nombre, cuenta){

const tarjetaDelMes = (mk, tid) => itemsDelMes(mk).filter(x => isCard(x.m) && (!tid || x.m.tarjeta === tid)).reduce((a,x)=>a+x.uyu,0);
function idsTarjetas(mk){
  const ids = new Set(S.cfg.tarjetas.map(t => t.id));
  for (const x of itemsDelMes(addMes(mk,-1)).concat(itemsDelMes(mk))) if (isCard(x.m)) ids.add(x.m.tarjeta);

}
// ---------- Lo que pasa de un mes al siguiente en una tarjeta ----------
// Al pagar menos o más que el resumen, el pago puede llevar traslado = {monto, moneda}:
// positivo = lo que faltó pagar pasa al resumen siguiente; negativo = saldo a favor que se descuenta del siguiente.
const pagosTarjeta = (mk, tid, excluir) => S.movs.filter(m => m.tipo === 'pago' && m.tarjeta === tid && mesDe(m.fecha) === mk && m.estado !== 'omitido' && m.id !== excluir);
const _cacheTj = new Map(); let _cacheTjMovs = null, _cacheTjPlan = null, _cacheTjCfg = null;
function memoTj(k, fn){ if (_cacheTjMovs !== S.movs || _cacheTjPlan !== S.plan || _cacheTjCfg !== S.cfg){ _cacheTj.clear(); _cacheTjMovs = S.movs; _cacheTjPlan = S.plan; _cacheTjCfg = S.cfg; } if (!_cacheTj.has(k)) _cacheTj.set(k, fn()); return _cacheTj.get(k); }
// Lo que sale de un mes hacia el siguiente, por moneda: los traslados elegidos al pagar y el saldo a favor que todavía no se usó
function arrastre(mk, tid){
  if (mk < inicio()) return {};
  return memoTj('a|' + mk + '|' + tid, () => {
    const out = {};
    for (const m of pagosTarjeta(mk, tid)) if (m.traslado && +m.traslado.monto) out[m.traslado.moneda] = (out[m.traslado.moneda] || 0) + (+m.traslado.monto);
    if (addMes(mk, -1) >= inicio()) for (const [mon, v] of Object.entries(restoTarjeta(mk, tid).credito)) out[mon] = (out[mon] || 0) - v;
    return out;
  });
}
// Lo que falta pagar de una tarjeta en un mes, por moneda (meses de la app; el anterior también de la app)
function restoTarjeta(mk, tid, excluir){
  const calc = () => {
    const deuda = {}, pagado = {};
    for (const x of itemsDelMes(addMes(mk,-1))) if (isCard(x.m) && x.m.tarjeta === tid){ const n = Math.max(1, x.cuotas || 1); deuda[x.m.moneda] = (deuda[x.m.moneda] || 0) + (+x.m.monto || 0) / n; }
    const entra = arrastre(addMes(mk, -1), tid);
    for (const [mon, v] of Object.entries(entra)) deuda[mon] = (deuda[mon] || 0) + v;
    const ps = pagosTarjeta(mk, tid, excluir);
    for (const m of ps){ pagado[m.moneda] = (pagado[m.moneda] || 0) + (+m.monto || 0); if (m.traslado && +m.traslado.monto) pagado[m.traslado.moneda] = (pagado[m.traslado.moneda] || 0) + (+m.traslado.monto); }
    const mons = [...new Set(Object.keys(deuda).concat(Object.keys(pagado)))];
    const resto = Object.fromEntries(mons.map(k => [k, (deuda[k] || 0) - (pagado[k] || 0)]));
    // lo pagado de más en una moneda (ej. la parte en dólares pagada en pesos) cubre la otra con la cotización de hoy
    let sobraBase = mons.reduce((a,k) => a + Math.max(0, -resto[k]) * tasaDe(k), 0);
    for (const k of mons.sort((a,b) => esPpal(a) ? -1 : esPpal(b) ? 1 : 0)) if (resto[k] > 0 && sobraBase > 0){ const q = Math.min(resto[k], sobraBase / tasaDe(k)); resto[k] -= q; sobraBase -= q * tasaDe(k); }
    // saldo a favor que vino del mes anterior y no se usó: sigue al mes siguiente
    const credito = {};
    for (const [mon, v] of Object.entries(entra)) if (v < 0 && resto[mon] < -0.004) credito[mon] = Math.min(-v, -resto[mon]);
    return {resto, credito, pagos: ps};
  };
  return excluir ? calc() : memoTj('r|' + mk + '|' + tid, calc);
}
// Para el formulario de pago: cuánto debía esa tarjeta este mes antes de este pago, en la moneda del pago
function deudaAntesDelPago(f){
  if (!f || f.tipo !== 'pago' || !f.tarjeta || !f.fecha) return null;
  const mk = mesDe(f.fecha); if (mk < inicio()) return null;
  if (addMes(mk, -1) < inicio()){ // primer mes: el resumen anterior viene de la planilla, en pesos
    const pagado = pagosTarjeta(mk, f.tarjeta, f.id).reduce((a,m) => a + toBase(m) + (m.traslado && +m.traslado.monto ? +m.traslado.monto * tasaDe(m.traslado.moneda) : 0), 0);
    return {monto: (tarjetaDelMes(addMes(mk,-1), f.tarjeta) - pagado) / (tasaDe(f.moneda) || 1), moneda: f.moneda};
  }
  const {resto} = restoTarjeta(mk, f.tarjeta, f.id);
  if ((resto[f.moneda] || 0) > 0.004) return {monto: resto[f.moneda], moneda: f.moneda};
  const base = Object.entries(resto).reduce((a,[k,v]) => a + Math.max(0, v) * tasaDe(k), 0);
  return {monto: base / (tasaDe(f.moneda) || 1), moneda: f.moneda};
}
const claveEst = (mk, tid, mon) => `${mk}|${tid}|${mon}`;

function pendientes(mk){

  for (const x of itemsDelMes(mk)) if (x.m.estado === 'pend') list.push({kind:'mov', m:x.m, uyu:x.uyu});
  for (const p of S.plant) if (p.activa !== false && !(p.desde && mk < p.desde) && !plantHecha(p, mk)) list.push({kind:'plant', p, uyu: toBase(p) + (p.tipo === 'ingreso' ? Math.round(totalDesc(p.id, mk)) : 0)});
  // Pago estimado de cada tarjeta: las cuotas de su resumen anterior menos lo que ya pagaste o tenés cargado este mes

// Filtros de Movimientos (también los usan los cuadros de la pantalla Mes)
function pasaFiltro(m, f){
  if (f === 'eventos') return !!m.evento;
  if (f.startsWith('ev:')) return m.evento === f.slice(3);
  const card = isCard(m);
  if (f === 'tarjeta') return card;
  if (f.startsWith('tarjeta:')) return m.tarjeta === f.slice(8);
  if (f.startsWith('persona:')) return conPersona(m, f.slice(8));
  if (f.startsWith('cuenta:')){ const id = f.slice(7); return m.cuenta === id || m.de === id || m.a === id; }
  if (f === 'gasto') return m.tipo === 'gasto' && !card;
  if (f.startsWith('cat:')) return m.tipo === 'gasto' && !card && m.cat === f.slice(4);
  if (f === 'salidas') return m.tipo === 'gasto' || m.tipo === 'pago'; // también las compras con tarjeta (se listan en el mes en que se pagan; el neto no las suma dos veces)
  if (f === 'pend') return m.estado === 'pend';
  return m.tipo === f;
}
const FILTRO_LBL = f => f.startsWith('ev:') ? (EV(f.slice(3))?.nombre || 'Viaje') : f.startsWith('persona:') ? nomPer(f.slice(8)) : f.startsWith('cat:') ? nomCat(f.slice(4)) : f.startsWith('tarjeta:') ? nomTj(f.slice(8)) : f.startsWith('cuenta:') ? nomCta(f.slice(7)) : ({eventos:'Viajes y salidas', salidas:'Salidas', pend:'Pendientes', mover:'Transferencias'}[f] || f);
function accionFila(x){
  const m = x.m;
  if (m.virtual === 'plant') return `data-act="plantform" data-id="${m.pid}"`;
  if (m.evento && m.division) return `data-act="evgasto" data-id="${m.id}"`;
  if (m.evento && (m.carga || (m.liq && m.saldo))) return `data-act="evcarga" data-id="${m.id}"`;
  if (m.evento && m.liq) return `data-act="evver" data-id="${m.evento}"`;
  if (m.virtual === 'est') return `data-act="pagoest" data-tj="${m.tarjeta}" data-mon="${m.moneda}" data-v="${m.monto}"`;
  return `data-act="edit" data-id="${m.id}"`;
}
function pendientesComoFilas(mk){
  return pendientes(mk).filter(p => p.kind !== 'mov' && p.kind !== 'per' && p.kind !== 'cob').map(p => p.kind === 'est'
    ? {m:{tipo:'pago', cat:'Pago tarjeta', concepto:`Pago ${nomTj(p.tarjeta)} (estimado)`, tarjeta:p.tarjeta, moneda:p.mon, monto:p.monto, tasa:tasaDe(p.mon), estado:'pend', fecha:`${mk}-01`, virtual:'est'}, uyu:p.uyu, cuota:0, cuotas:1}
    : {m:{...movDesdePlant(p.p, 'pend', mk), virtual:'plant', pid:p.p.id}, uyu:p.uyu, cuota:0, cuotas:1});
}
// ---------- Ritmo del gasto del día a día ----------
const esVariable = m => m.tipo === 'gasto' && !m.ajeno && !isCard(m) && !pagoOtro(m) && !(m.split && m.split.modo === 'prestado') && catsVariables().includes(m.cat) && !m.plantilla && m.origen !== 'arrastre' && m.estado !== 'omitido';
// Barra de 4 tramos (semanas del mes) que se va pintando con los días que pasan.
// Cada semana se mide sola: su parte de lo que queda del presupuesto. La semana en curso se pinta según lo que correspondía gastar hasta hoy.
function barraSemanas(mk, saldoFin){
  const B = +S.cfg.presupuesto || 0; if (!B) return '';
  if (mk < inicio()){ // meses de la planilla: sin fechas, se compara el total del mes con el presupuesto, en promedio por semana
    const total = itemsDelMes(mk).filter(x => esVariable(x.m)).reduce((a,x) => a + x.uyu, 0);
    if (!S.plan[mk]) return '';
    const cls = total <= B + 1 ? 'bien' : 'mal';
    return `<div class="semanas" role="img" aria-label="Gasto del día a día del mes: ${fmt(total)}, en promedio ${fmt(total / 4)} por semana contra ${fmt(B / 4)} previstos.">${('<span class="sem"><i class="' + cls + '" style="width:100%"></i></span>').repeat(4)}</div>`;
  }
  const [y, mo] = mk.split('-').map(Number), dias = new Date(y, mo, 0).getDate();
  const hoyMk = hoyMes(), diaHoy = mk === hoyMk ? +hoy().slice(8,10) : mk < hoyMk ? dias : 0;
  const varPorDia = Array(dias + 2).fill(0);
  for (const m of S.movs) if (esVariable(m) && m.estado !== 'pend' && mesDe(m.fecha) === mk) varPorDia[Math.min(dias, +m.fecha.slice(8,10))] += toBase(m);
  const suma = (a, b) => varPorDia.slice(a, b + 1).reduce((t, v) => t + v, 0);
  const cortes = [0, 1, 2, 3, 4].map(k => Math.round(dias * k / 4));
  const estados = []; let txt = '';
  const tramos = [0, 1, 2, 3].map(k => {
    const d1 = cortes[k] + 1, d2 = cortes[k+1], largo = d2 - d1 + 1;
    if (diaHoy < d1){ estados.push('sin empezar'); return `<span class="sem"></span>`; }
    // Cada semana es independiente: su parte fija del presupuesto del mes, según los días que tiene
    const semB = B * largo / dias;
    const hasta = Math.min(d2, diaHoy), gastado = suma(d1, hasta), terminada = hasta === d2;
    // Arranca en verde y pasa a rojo cuando lo gastado en la semana supera su presupuesto; al cerrar queda con el resultado final
    const tope = semB, bien = gastado <= tope + 1;
    estados.push(`${bien ? 'bien' : 'pasada'}: ${fmt(gastado)} de ${fmt(semB)}`);
    if (!terminada) txt = `Semana ${k+1}: llevás ${fmt(gastado)} de ${fmt(semB)}${gastado <= semB ? ` · te quedan ${fmt(semB - gastado)}` : ` · te pasaste ${fmt(gastado - semB)}`}`;
    const pct = ((hasta - d1 + 1) / largo * 100).toFixed(1);
    return `<span class="sem${terminada ? '' : ' encurso'}"><i class="${bien ? 'bien' : 'mal'}" style="width:${pct}%"></i></span>`;
  });
  return `<div class="semanas" role="img" aria-label="Semanas del mes: ${estados.map((e,i) => `semana ${i+1} ${e}`).join(', ')}.">${tramos.join('')}</div>${txt ? `<span class="semtxt num">${txt}</span>` : ''}`;
}

`;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function dibujarGraficas(){

  const mc = S.cfg.monedaCapital && S.cfg.monedas.some(m => m.id === S.cfg.monedaCapital) ? S.cfg.monedaCapital : monP().id;
  Chart.defaults.font.family = css('--f-body'); Chart.defaults.color = css('--muted');
  const sim = monLbl(monP().id);

  const xs = {grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:12}};
  const base = (enCap, stacked) => ({responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => `${c.dataset.label}: ${enCap ? fmtEn(c.parsed.y, mc) : fmt(c.parsed.y)}`}}},
    scales:{x:{...xs, stacked}, y:{stacked, grid:{color:grid}, border:{display:false}, ticks:{callback: enCap ? (v => monLbl(mc) + ' ' + v.toLocaleString('es-UY')) : money}}}});
  const c1 = $('#ch1'), c2 = $('#ch2'), c3 = $('#ch3');
  const pctA = S.vistaAn === 'pct', PA = (v, x) => pctA ? (x.ing ? v / x.ing * 100 : null) : v;
  const o1 = base(false, true); if (pctA){ o1.scales.y.ticks.callback = v => v + ' %'; o1.plugins.tooltip.callbacks.label = c => `${c.dataset.label}: ${c.parsed.y == null ? '—' : c.parsed.y.toFixed(1) + ' %'}`; }
  if (c1) charts.push(new Chart(c1, {data:{labels, datasets: CATS().map(c => ({type:'bar', label:c.nombre, data:sel.map(x=>PA(x.cats[c.id]||0, x)), backgroundColor:colCatRes(c.id), stack:'s', borderRadius:2}))
    .concat([{type:'bar', label:'Pago tarjetas', data:sel.map(x=>PA(x.pagos, x)), backgroundColor:css('--c-tarjeta'), stack:'s', borderRadius:2},

  // Vista en % del ingreso: cada barra se divide por el ingreso de su mes
  const pct = S.vistaAn === 'pct', P_ = (v, x) => pct ? (x.ing ? v / x.ing * 100 : null) : v;
  const optsIng = () => { const o = base(false, true); if (pct){ o.scales.y.ticks.callback = v => v + ' %'; o.plugins.tooltip.callbacks.label = c => `${c.dataset.label}: ${c.parsed.y == null ? '—' : c.parsed.y.toFixed(1) + ' %'}`; } return o; };
  const lineaIng = () => ({type:'line', label: pct ? 'Ingresos (100 %)' : 'Ingresos', data:sel.map(x => pct ? (x.ing ? 100 : null) : x.ing), borderColor:css('--c-ing'), borderWidth:2, pointRadius: sel.length < 3 ? 3 : 0, tension:.25, stack:'i'});
  const c4 = $('#ch4');
  if (c4) charts.push(new Chart(c4, {data:{labels, datasets: SUBS().concat([SIN_SUB]).filter(s => sel.some(x => x.rec[s.id])).map(s => ({type:'bar', label:s.nombre, data:sel.map(x => P_(x.rec[s.id]||0, x)), backgroundColor:colSubRes(s), stack:'s', borderRadius:2})).concat([lineaIng()])}, options: optsIng()}));
  if (c2) charts.push(new Chart(c2, {type:'bar', data:{labels, datasets:[{label:'Ahorro', data:sel.map(x=>x.ahorro), backgroundColor:css('--c-ahorro'), borderRadius:3}]}, options: base(false, false)}));
  if (c3) charts.push(new Chart(c3, {type:'line', data:{labels, datasets:[{label:'Capital', data:sel.map(x=>x.capMc), borderColor:css('--accent'), backgroundColor:css('--accent-soft'), fill:true, borderWidth:2, pointRadius: sel.length < 3 ? 3 : 0, pointHoverRadius:4, tension:.25}]}, options: base(true, false)}));

let K = null;

  for (const d of Object.values(S.plan)) n += (d.items || []).filter(it => it.tipo === 'gasto' && it.cat === id).length;
  return n;
}

    ${K.borrar ? `<p style="margin:0">${n ? `<strong>${esc(K.nombre)}</strong> tiene ${n} ${n === 1 ? 'gasto' : 'gastos'} (contando los gastos recurrentes). ¿A qué categoría los paso?` : `¿Borrar <strong>${esc(K.nombre)}</strong>?`}</p>
      ${n ? `<div class="field"><span class="label">Pasarlos a</span>${chipsDe('g', 'moverA', otras.map(k => [k.id, k.nombre]), K.moverA)}</div>` : ''}

    ${!K.nuevo ? `<p class="note" style="margin:0">${n ? `Tiene ${n} ${n === 1 ? 'gasto' : 'gastos'}. Si le cambiás el nombre, se actualiza en todos.` : 'Todavía no tiene gastos.'}</p>` : ''}

  </form></div>`;
  if (!re && !K.borrar) setTimeout(() => $('#k-nombre')?.focus(), 60);

function leerCat(){ const nm = $('#k-nombre'); if (nm) K.nombre = nm.value; const d = $('#k-dia'); if (d) K.dia = d.checked; }
async function enviarCat(){
  leerCat();
  const nombre = K.nombre.trim();
  if (!nombre){ toast('Escribí un nombre'); return; }
  if (CATS().some(k => k.id !== K.id && k.nombre.toLowerCase() === nombre.toLowerCase())){ toast('Ya hay una categoría con ese nombre'); return; }
  const lista = CATS().map(k => ({...k}));
  if (K.nuevo){ let id = nombre; while (lista.some(k => k.id === id) || ['Ingreso','Transferencia','Pago tarjeta','Ahorro','Retiro','Cambio'].includes(id)) id = nombre + '·' + Math.random().toString(36).slice(2,5); lista.push({id, nombre, color:K.color, dia:K.dia}); }
  else { const k = lista.find(x => x.id === K.id); Object.assign(k, {nombre, color:K.color, dia:K.dia}); }
  const nuevo = K.nuevo;
  if (await guardarCfg({cats: lista})){ cerrar(); render(); toast(nuevo ? 'Categoría agregada' : 'Categoría guardada'); }

async function borrarCat(){
  const n = usosCat(K.id);
  if (n && !K.moverA){ toast('Elegí a qué categoría pasar los gastos'); return; }
  const de = K.id, a = K.moverA;
  if (n){
    toast('Pasando los gastos…');
    try {
      for (const m of S.movs.filter(m => m.tipo === 'gasto' && m.cat === de)) await S.db.collection(COL.movs).doc(m.id).update({cat:a});
      for (const p of S.plant.filter(p => p.tipo === 'gasto' && p.cat === de)) await S.db.collection(COL.plant).doc(p.id).update({cat:a});
      for (const [mk, d] of Object.entries(S.plan)) if ((d.items || []).some(it => it.tipo === 'gasto' && it.cat === de))
        await S.db.doc('planilla/' + mk).update({items: d.items.map(it => it.tipo === 'gasto' && it.cat === de ? {...it, cat:a} : it)});
    } catch(e){ toast('No se pudieron pasar todos los gastos. Probá de nuevo.'); return; }
  }
  if (await guardarCfg({cats: CATS().filter(k => k.id !== de).map(k => ({...k}))})){
    if (S.filtro === 'cat:' + de) S.filtro = 'todo';
    cerrar(); render(); toast(n ? `Gastos pasados a ${nomCat(a)} y categoría borrada` : 'Categoría borrada');
  }
}

async function borrarSub(){

// ---------- Ayuda ----------
function abrirAyuda(){
  $('#overlay').innerHTML = `<div class="scrim" data-act="close"><div class="sheet anim" role="dialog" aria-modal="true" aria-label="Cómo funciona">
    <header><h3>Cómo funciona</h3><button type="button" class="iconbtn" data-act="close" aria-label="Cerrar">${chev('M6 6l12 12M18 6L6 18')}</button></header>
    <div class="help">
      <div><h4>1. Prepará la app (una sola vez)</h4><ol>
        <li><strong>Monedas</strong>: la primera es la principal y todo se suma en ella. Agregá las otras que uses con su cotización.</li>
        <li><strong>Cuentas</strong>: renombrá las de ejemplo o creá las tuyas. Elegí si son del día a día o de ahorro, qué monedas tienen y cuánto tienen hoy.</li>
        <li><strong>Tarjetas</strong>: nombre, monedas, día de cierre, día de vencimiento y desde qué cuenta la pagás.</li>
        <li><strong>Gastos recurrentes</strong>: lo que se repite todos los meses (alquiler, servicios, sueldo, ahorro mensual).</li>
        <li><strong>Presupuesto</strong> (opcional): cuánto pensás gastar por mes en el día a día.</li></ol></div>
      <div><h4>2. Cargá tus movimientos</h4><ul>
        <li>Con el botón <strong>+</strong>: Gasto, Ingreso, Transferir o Pagar tarjeta.</li>
        <li>En un gasto elegís de qué cuenta salió o con qué tarjeta lo pagaste, y la categoría. Con tarjeta podés poner cuotas.</li>
        <li>Para cambiar el monto o la moneda, tocá el símbolo de la moneda al lado del monto.</li>
        <li>Si algo todavía no lo pagaste, guardalo como <em>Pendiente</em>.</li></ul></div>
      <div><h4>3. Cada mes</h4><ul>
        <li>En <strong>Pendientes</strong> aparecen tus gastos recurrentes y el pago estimado de cada tarjeta. Tocá <em>Pagado</em> si fue el monto habitual, o tocá el nombre para poner el monto real. <em>Omitir</em> lo saca solo de este mes.</li>
        <li><strong>Te queda a fin de mes</strong> es lo que entra a tus cuentas del día a día, menos lo que sale y lo que pasás a ahorro, contando lo pendiente.</li></ul></div>
      <div><h4>Gastos compartidos</h4><ul>
        <li>En <strong>Ajustes → Personas</strong> agregás con quién compartís gastos. Al cargar un gasto, marcá <em>Compartido con otra persona</em>, tocá su nombre, elegí quién pagó y qué parte paga cada uno (por defecto, mitad y mitad).</li>
        <li>Si pagaste vos, el gasto sale entero de tu cuenta y la otra persona te debe su parte. Si pagó la otra persona, no toca tus cuentas y le debés la tuya.</li>
        <li>Si pagó la otra persona, cada mes aparece en Pendientes <em>Pagarle a…</em> con tu parte; al pagarle, cuenta como tu gasto del mes.</li>
        <li><strong>Se lo presté</strong>: si alguien usa tu tarjeta o tu plata para algo suyo, marcá <em>Compartido</em> → <em>Se lo presté</em>. Sale de tu cuenta o tarjeta, pero esa persona te debe todo (en cuotas, de a una por mes).</li>
        <li>En cuotas: si lo pagó la otra persona (por ejemplo, un pasaje en 5 cuotas con su tarjeta), elegí las cuotas y cada mes se suma una a lo que le debés. Si lo pagaste vos con tu tarjeta en cuotas, la otra persona te debe su parte de a una cuota por mes.</li>
        <li>En <strong>Movimientos → Personas</strong> ves todos los gastos con esa persona y cuánto te debe o le debés. Con <em>Me pagó</em> o <em>Le pagué</em> registrás cuando saldan.</li></ul></div>
      <div><h4>Pagar menos o más que el resumen</h4><ul>
        <li>Si pagás una tarjeta por menos que el resumen (por ejemplo, el mínimo), aparece un tilde para <strong>pasar lo que falta al resumen del mes siguiente</strong>. Sin el tilde, lo que falta queda pendiente en este mes.</li>
        <li>Si pagás de más o hacés un adelanto, el tilde <strong>descuenta ese saldo a favor del resumen siguiente</strong>. Si el saldo a favor es mayor que ese resumen, lo que sobra sigue pasando.</li></ul></div>
      <div><h4>Descuentos del sueldo</h4><ul>
        <li>Si te descuentan algo del sueldo (un préstamo, una cuota, un aporte), cargalo como gasto de todos los meses y marcá <em>¿Te lo descuentan de un ingreso?</em> eligiendo tu sueldo. Aparece en <strong>Ajustes → Descuentos del sueldo</strong>.</li>
        <li>Al cobrar, poné lo que cobraste en mano: la app suma los descuentos, registra el sueldo completo y marca los descuentos del mes como pagados. Podés tener varios descuentos y en más de un ingreso.</li></ul></div>
      <div><h4>Cuentas</h4><ul>
        <li>En <strong>Cuentas</strong>, el botón <em>+ Nuevo movimiento</em> te deja elegir: <strong>Depósito</strong> (plata que cobrás y entra a una cuenta), <strong>Retiro</strong> (sacar efectivo de una cuenta) o <strong>Mover entre cuentas</strong> (también para cambiar de moneda).</li>
        <li>El capital es la suma de tus cuentas de ahorro; las del día a día no cuentan.</li></ul></div>
      <div><h4>Transferencias</h4><ul>
        <li>Mueven plata entre tus cuentas, o entre monedas de una misma cuenta (comprar o vender dólares). Si cambia la moneda, escribís cuánto entra.</li>
        <li>Del día a día a una cuenta de ahorro cuenta como ahorro del mes; al revés, como retiro. Entre cuentas del mismo tipo no cambia el saldo del mes.</li></ul></div>
      <div><h4>Tarjetas de crédito</h4><ul>
        <li>Una compra con tarjeta no resta del mes en que la hacés: aparece en el cuadro Tarjetas y se paga en el mes que corresponde según el cierre. Si es en cuotas, cada mes aparece una cuota. En Movimientos, cada compra con tarjeta (o cada cuota) figura en el mes en que se paga.</li>
        <li>Cuando pagás la factura, usá <em>Pagar tarjeta</em> (o el pendiente estimado). Podés hacer pagos parciales o adelantos.</li></ul></div>
      <div><h4>Pantallas</h4><ul>
        <li><strong>Mes</strong>: cómo venís este mes, por categoría, tarjetas y pendientes.</li>
        <li><strong>Movimientos</strong>: todo lo del mes, con filtros por tipo, categoría, tarjeta y cuenta.</li>
        <li><strong>Cuentas</strong>: el saldo de cada cuenta en cada moneda y tu capital ahorrado.</li>
        <li><strong>Análisis</strong>: gráficas mes a mes, tasa de ahorro y en qué se va la plata.</li></ul></div>
      <div><h4>Viajes y salidas</h4><ul>
        <li>En <strong>Viajes</strong> creás un viaje con fechas y con quién vas (de tus Personas). Cada uno carga sus viáticos desde una cuenta; lo que se paga con viáticos o se divide durante el viaje queda en el viaje y se salda ahí. Con tarjeta va al resumen de la tarjeta.</li>
        <li>Lo que cargás con ese botón es un gasto común que además resta de los viáticos. Lo previo (vuelos, reservas) lo cargás con el + de siempre y elegís el viaje en "¿Es de un viaje?".</li>
        <li>Si un gasto lo pagó otra persona, usá Dividir → pagó ella: no aparece en tus gastos, queda en el viaje y como deuda. Cuando le pagás, ese pago sí aparece.</li>
        <li>Una comida o salida puede tener invitados temporales. Lo que pagás vos aparece en tus gastos; lo que pagan otros, solo en la salida. Al saldar: si pagás vos es un gasto, si te pagan es un ingreso.</li></ul></div>
      <div><h4>Tus datos y el cambio de teléfono</h4><ul>
        <li>${S.modo === 'local' ? 'Tus datos se guardan en este dispositivo y la app funciona sin internet.' : 'Tus datos se guardan en tu cuenta de Claude.'}</li>
        ${driveDisponible() ? `<li>Si conectás <strong>Google Drive</strong> (Ajustes → Tus datos), también se guardan en el archivo ${DRIVE.archivo} de tu Drive. Cada cambio se sube solo; si pasó un rato, la app te pide un toque en <em>Sincronizar</em> para renovar el permiso. En otro teléfono o en la computadora, abrí la app y conectá la misma cuenta.</li>` : ''}
        <li>En <strong>Ajustes → Tus datos</strong>: <em>Exportar copia de seguridad</em> baja un archivo con todo. En el teléfono nuevo, abrí la app y tocá <em>Importar copia</em>.</li>
        <li>También podés bajar tus movimientos en un archivo para Excel.</li></ul></div>
    </div>
    <div class="actions"><button type="button" class="btn primary" data-act="close">Entendido</button></div>
  </div></div>`;
}

// ---------- Hoja de carga / edición de movimientos ----------
let F = null;
const fechaDefecto = () => { const mk = S.mes; return mk === hoyMes() ? hoy() : `${mk}-${mk < hoyMes() ? '28' : '01'}`; };
function nuevoForm(base={}){
  if (!S.cfg.cuentas.length){ toast('Primero agregá una cuenta en Ajustes'); location.hash = '#ajustes'; return; }
  F = {id:null, tipo:'gasto', cat:catDefecto(), concepto:'', monto:'', moneda:null, cuenta:cuentaDefecto(), tarjeta:null, cuotas:1, estado:'pagado', fecha:fechaDefecto(), nota:'', plantilla:null, mesResumen:null, ...base};
  F.split = base.split ? JSON.parse(JSON.stringify(base.split)) : null;
  F.splitOpen = !!F.split; F.splitModo = (F.split && F.split.modo) || 'div';
  if (pagoOtro(F)){ F.cuenta = cuentaDefecto(); }
  if (F.tipo === 'pago' && !F.tarjeta) F.tarjeta = S.cfg.tarjetas[0]?.id || null;
  if (F.tipo === 'pago' && !base.cuenta) F.cuenta = TJ(F.tarjeta)?.cuentaPago || cuentaDefecto();
  if (F.tipo !== 'gasto' && F.tipo !== 'pago') F.tarjeta = null;
  if (!CTA(F.cuenta) && !F.id) F.cuenta = cuentaDefecto();
  arreglarMoneda();
  F.montoTxt = F.monto ? dec(F.monto) : '';
  F.montoTxt = F.monto ? dec(F.monto) : '';
  F.resManual = !!((F.id || F.plRef) && F.mesResumen);
  if (F.tipo === 'pago') F.trasladar = !!(F.traslado && +F.traslado.monto);
  if (F.tipo === 'ingreso'){
    if (F.neto != null){ F.monto = F.neto; F.montoTxt = dec(F.neto); F.inclDesc = true; F.ingDesc = F.plantilla && S.plant.some(x => x.id === F.plantilla && x.tipo === 'ingreso') ? F.plantilla : (S.plant.find(x => x.tipo === 'ingreso' && x.bhu) || {}).id || null; }
    else if (F.plantilla && descuentosDe(F.plantilla).length){ F.ingDesc = F.plantilla; F.inclDesc = true; }
  }
  abrirHoja();
}
function monedasForm(){ const ms = F.tipo === 'gasto' && F.tarjeta ? monedasDe('t', F.tarjeta) : enViajeF() && !pagoOtro(F) ? S.cfg.monedas.map(m => m.id) : monedasDe('c', F.cuenta); return F.moneda && !ms.includes(F.moneda) && S.cfg.monedas.some(m => m.id === F.moneda) ? ms.concat([F.moneda]) : ms; }
function arreglarMoneda(){ const ms = monedasForm(); if (!ms.includes(F.moneda)) F.moneda = ms.includes(monP().id) ? monP().id : ms[0]; }
function sugerencias(){
  const cnt = {};

function pintarSplit(){

// Arma el movimiento del mes a partir de un gasto recurrente o movimiento de todos los meses
function movDesdePlant(p, estado, mk){
  mk = mk || S.mes;
  const fecha = mk === hoyMes() ? hoy() : `${mk}-${mk < hoyMes() ? '28' : '01'}`;
  const monto = estado === 'omitido' ? 0 : (+p.monto || 0);
  const o = {fecha, tipo:p.tipo, cat: p.tipo === 'gasto' ? (p.cat || 'Fijos') : p.tipo === 'mover' ? 'Transferencia' : 'Ingreso', concepto:p.nombre, monto, moneda:p.moneda,
    tasa: tasaDe(p.moneda) || 1, cuenta: p.cuenta || null, tarjeta: p.tarjeta || null, cuotas:1, estado, nota:'', plantilla:p.id, creado:Date.now()};
  if (p.tipo === 'mover'){ o.modo = p.modo || 'mover'; o.de = p.de; o.a = p.a; o.monA = p.monA || p.moneda; o.montoA = Math.round(convierte(monto, p.moneda, o.monA) * 100) / 100; o.cuenta = null; }
  if (p.tarjeta) o.mesResumen = mk;
  if ((p.tipo === 'ingreso' || p.tipo === 'gasto') && p.persona && PER(p.persona)) o.cargo = p.persona;
  if (p.tipo === 'ingreso' && estado !== 'omitido'){ const d = totalDesc(p.id, mk); if (d > 0){ o.neto = monto; o.descTotal = Math.round(d / (tasaDe(p.moneda) || 1) * 100) / 100; o.monto = monto + o.descTotal; } }
  return o;
}

// ---------- Viajes y comidas con amigos ----------
// Un viaje no mueve plata: tiene fechas, un presupuesto de viáticos y las personas con quienes vas (de tu lista de Personas).
// Sus gastos son movimientos comunes con la marca evento (y fase: antes o durante el viaje): cuentan en tu mes como siempre,
// y si los pagó otra persona (dividido con Lu, por ejemplo) quedan como deuda con ella, igual que cualquier gasto compartido.
// Una comida o salida admite invitados temporales. Lo que pagás vos es un gasto común; lo que pagan otros queda solo en el evento.
// Cuando saldás cuentas: si pagás vos, es un gasto; si te pagan, un ingreso.
let E = null, V = null, LQ = null;
const SVG_VIAJE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>';
const SVG_GRUPO = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
const icoEv = e => `<span style="color:var(--viaje);display:inline-flex;vertical-align:-3px;margin-right:4px">${e.tipo === 'viaje' ? SVG_VIAJE : SVG_GRUPO}</span>`;
const miNombre = () => S.cfg.miNombre || 'Gonza';
function estadoEv(e){ const h = hoy(); if (e.cerrado) return 'archivado'; if (h < e.desde) return 'proximo'; if (h <= (e.hasta || e.desde)) return 'activo'; return 'terminado'; }
const EST_LBL = {activo:'En curso', proximo:'Próximo', terminado:'Terminado', archivado:'Archivado'};
const EST_PILL = {activo:'ev', proximo:'est', terminado:'pend', archivado:'est'};
const rangoEv = e => e.hasta && e.hasta !== e.desde ? `${dia(e.desde)} al ${dia(e.hasta)}` : dia(e.desde);
const enEv = (m, e) => m.moneda === e.moneda ? (+m.monto || 0) : (+m.monto || 0) * (m.tasa || tasaDe(m.moneda)) / (tasaDe(e.moneda) || 1);
const fmtE = (n, e) => fmtEn(n, e.moneda);
const nomP = (e, id) => id === 'yo' ? miNombre() : ((e.participantes || []).find(p => p.id === id)?.nombre || nomPer(id));
const gastosEv = id => S.movs.filter(m => m.evento === id && m.tipo === 'gasto' && m.estado !== 'omitido' && !m.liq && !m.carga);
const cargasEv = id => S.movs.filter(m => m.evento === id && m.carga && m.estado !== 'omitido');
const saldosEv = id => S.movs.filter(m => m.evento === id && m.liq && m.saldo && m.estado !== 'omitido');
// Lo que puso cada uno en los viáticos (en moneda principal). Los viáticos son de todos: cada gasto pagado con ellos lo pagó cada uno en proporción a lo que puso.
function aportesEv(e){
  const a = {yo:0};
  for (const m of cargasEv(e.id)){ const k = m.aportePor || 'yo'; a[k] = (a[k] || 0) + toBase(m); }
  for (const m of saldosEv(e.id)) if (m.viatico) a.yo += m.tipo === 'ingreso' ? toBase(m) : -toBase(m); // pagos viejos que iban a los viáticos
  return a;
}
// Tu parte de un gasto: en un viaje, según cómo lo dividiste (split); en una comida, según entre quiénes se repartió
const parteMia = m => m.division ? (m.division.includes('yo') ? 1 / m.division.length : 0) : m.split ? (+(m.split.partes || {}).yo || 0) / 100 : 1;
const quienPago = (m, e) => m.viatico ? 'los viáticos' : m.ajeno ? nomP(e, m.pagador) : pagoOtro(m) ? nomPer(m.split.pagador) : miNombre();

// ---------- Cuentas de un viaje ----------
// Viáticos: la plata que pasaste al viaje (desde el día a día o el ahorro) más lo que te devolvieron a los viáticos, menos lo que pagaste con ellos.
// Con tarjeta: va al resumen de la tarjeta (cuenta en tus meses, en cuotas si corresponde) y no resta de los viáticos.
function resumenViaje(e){
  const gs = gastosEv(e.id), r = {pre:0, viaje:0, total:0, mia:0, n:gs.length, tarjeta:0, viat:0, cargas:0, legado:0};
  for (const m of gs){ const v = enEv(m, e); r.total += v; r.mia += v * parteMia(m); if (m.fase === 'viaje') r.viaje += v; else r.pre += v;
    if (isCard(m) && !pagoOtro(m)) r.tarjeta += v; else if (m.viatico) r.viat += v; else if (m.fase === 'viaje' && !pagoOtro(m) && !m.ajeno) r.legado += v; }
  r.aportes = aportesEv(e);
  r.cargas = Object.values(r.aportes).reduce((a, v) => a + v, 0) / (tasaDe(e.moneda) || 1);
  r.usado = r.viat + r.legado; // legado: gastos del viaje cargados antes con una cuenta
  r.pres = r.cargas; r.queda = r.pres - r.usado;
  return r;
}
// Lo que cada persona del viaje te debe (+) o le debés (−) por los gastos de este viaje, en moneda principal
function deudasViaje(e){
  const gs = gastosEv(e.id), out = {};
  const sal = saldosEv(e.id), A = aportesEv(e), T = Object.values(A).reduce((a, v) => a + Math.max(0, v), 0);
  for (const p of (e.participantes || []).filter(p => p.id !== 'yo')) out[p.id] = gs.concat(sal).reduce((a, m) => {
    if (!enViajeM(m)) return a;
    if (m.viatico && !m.liq){ // pagado con los viáticos: cada uno lo pagó según lo que puso
      const v = toBase(m), pa = m.split ? (m.split.partes || {}) : {yo:100}, pg = m.split ? (m.split.pagador || 'yo') : 'yo';
      const fr = x => T > 0 ? Math.max(0, A[x] || 0) / T : (pg === x ? 1 : 0);
      return a + v * (+pa[p.id] || 0) / 100 * fr('yo') - v * (+pa.yo || 0) / 100 * fr(p.id);
    }
    return a + efectoPersona0(m, p.id, '9999-12');
  }, 0);
  return out;
}

// ---------- Cuentas de una comida o salida (estilo Splitwise, con invitados temporales) ----------
function repartir(c, ids){ const n = ids.length, b = Math.floor(c / n); let r = c - b * n; const o = {}; ids.forEach(id => { o[id] = b + (r > 0 ? 1 : 0); if (r > 0) r--; }); return o; }
function balancesEv(e){ // en centavos: lo que pagó cada uno menos lo que consumió
  const net = {}; (e.participantes || []).forEach(p => net[p.id] = 0);
  for (const m of gastosEv(e.id)){
    const c = Math.round(enEv(m, e) * 100), pg = m.pagador || 'yo', ids = m.division && m.division.length ? m.division : [pg];
    net[pg] = (net[pg] || 0) + c;
    for (const [id, x] of Object.entries(repartir(c, ids))) net[id] = (net[id] || 0) - x;
  }
  for (const l of e.liquidaciones || []){ const c = Math.round(l.monto * 100); net[l.de] = (net[l.de] || 0) + c; net[l.a] = (net[l.a] || 0) - c; }
  return net;
}
function saldarEv(net){ // el que más debe le paga al que más le deben: como mucho una transferencia menos que la cantidad de personas
  const d = [], a = [];
  for (const [id, v] of Object.entries(net)){ if (v < 0) d.push({id, v:-v}); else if (v > 0) a.push({id, v}); }
  d.sort((x, y) => y.v - x.v); a.sort((x, y) => y.v - x.v);
  const out = []; let i = 0, j = 0;
  while (i < d.length && j < a.length){ const x = Math.min(d[i].v, a[j].v); out.push({de:d[i].id, a:a[j].id, monto:x / 100}); d[i].v -= x; a[j].v -= x; if (!d[i].v) i++; if (!a[j].v) j++; }
  return out;
}

function waTexto(e){
  const gs = gastosEv(e.id).slice().sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '')), n = (e.participantes || []).length;

  gs.forEach(m => { const q = quienPago(m, e); pag[q] = (pag[q] || 0) + enEv(m, e); });
  let s = `${e.tipo === 'viaje' ? '✈️' : '🍽️'} *${e.nombre}* (${rangoEv(e)})\nTotal: ${fmtE(total, e)}${n > 1 ? ` entre ${n} personas` : ''}\n`;

  if (e.tipo !== 'viaje'){ const tr = saldarEv(balancesEv(e)); s += `\n\n*Para quedar a mano*\n` + (tr.length ? tr.map(x => `• ${nomP(e, x.de)} → ${nomP(e, x.a)}: ${fmtE(x.monto, e)}`).join('\n') : '• Estamos a mano 🙌'); }
  if (gs.length) s += `\n\n_Detalle_\n` + gs.map(m => `– ${m.concepto}: ${fmtE(enEv(m, e), e)} (pagó ${quienPago(m, e)})`).join('\n');

// ---------- Inicio: resumen de cada viaje o comida vigente, con su botón para cargar gastos ----------
function tarjetaViajes(){
  // En el mes actual: todo lo que no está archivado. En cualquier mes: los viajes y salidas que caen en ese mes, aunque duren más de uno.

      ${r.pres ? ritmoViaje(e, r, st) : ''}

// Ritmo de los viáticos: lo previsto por día, lo que venís gastando por día y lo que te queda por día en los días que faltan
function ritmoViaje(e, r, st){
  const largo = diasEntre(e.desde, e.hasta || e.desde) + 1, porDia = r.pres / largo;
  const box = (l, v, s, cls) => `<div class="mini${cls ? ' ' + cls : ''}"><span class="label">${l}</span><strong class="num">${v}</strong><span class="note">${s}</span></div>`;
  if (st !== 'activo') return `<div class="minis">${box('Presupuesto por día', fmtE(porDia, e), `${largo} ${largo === 1 ? 'día' : 'días'} de viaje`)}</div>`;
  const llevo = Math.min(largo, diasEntre(e.desde, hoy()) + 1), faltan = Math.max(1, largo - llevo + 1);
  const gastoDia = r.usado / llevo, quedaDia = r.queda / faltan;
  return `<div class="minis">${box('Presupuesto por día', fmtE(porDia, e), `${largo} días de viaje`)}${box('Venís gastando', fmtE(gastoDia, e) + ' / día', `en ${llevo} ${llevo === 1 ? 'día' : 'días'}`, gastoDia > porDia + 0.005 ? 'mal' : 'bien')}${box('Te quedan por día', fmtE(quedaDia, e), `${faltan} ${faltan === 1 ? 'día' : 'días'} (con hoy) · ${fmtE(r.queda, e)}`, quedaDia < porDia - 0.005 ? 'mal' : 'bien')}</div>`;

const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);

// ---------- En la hoja de un gasto que viene del botón de un viaje ----------

    <span class="note">${esc(nota)}${F.id ? ' <button type="button" class="lnk" data-f="evento" data-v="">Sacarlo del viaje</button>' : ''}</span></div>`;

function nuevoGastoViaje(e, fase){

  nuevoForm({evento:e.id, fase, ...(cta ? {cuenta:cta, moneda:mon} : {}), ...(fase === 'viaje' ? {viatico:true, moneda:mon} : {}), ...(con.length ? {split:{con, pagador:'yo', partes:{}, modo:'div'}} : {})});

// ---------- Pantalla Viajes ----------
function vEventos(){
  if (S.evSel){ const e = EV(S.evSel); if (e) return vEvento(e); S.evSel = null; }
  const evs = S.evs || [];
  const vivos = evs.filter(e => estadoEv(e) !== 'archivado').sort((a, b) => (a.desde || '').localeCompare(b.desde || ''));

function vEvento(e){

    const filaC = m => `<div class="row click" data-act="evcarga" data-id="${m.id}"><div class="t">${m.liq ? esc(m.concepto) : m.aportePor ? `Puso ${esc(nomPer(m.aportePor))}` : 'Pusiste vos'}</div><div class="m">${dia(m.fecha)} · ${m.liq ? (m.viatico ? 'en los viáticos' : esc(nomCta(m.cuenta))) : m.aportePor ? 'de sus cuentas' : 'desde ' + esc(nomCta(m.cuenta))}${m.estado === 'pend' ? ' · <span class="pill pend">Confirmá la cuenta</span>' : ''}</div><div class="a num ${m.tipo === 'ingreso' ? 'pos' : ''}">${m.liq && m.tipo === 'gasto' ? '− ' : m.liq ? '+ ' : ''}${fmtE(enEv(m, e), e)}</div></div>`;

      ${!PERS().length ? '<p class="note" style="margin:6px 0 0">Para compartir un viaje, agregá a la persona en Ajustes → Personas.</p>' : ''}

      ${sal.length ? `<h3 class="label" style="margin:14px 0 6px">Pagos entre ustedes</h3><div class="list">${sal.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')).map(filaC).join('')}</div>` : ''}

  } else {
    const net = balancesEv(e), tr = saldarEv(net), yo = (net.yo || 0) / 100, total = gs.reduce((a, m) => a + enEv(m, e), 0);
    const balHtml = parts.map(p => { const v = (net[p.id] || 0) / 100, col = v > 0.004 ? 'var(--good)' : v < -0.004 ? 'var(--bad)' : 'var(--muted)'; return `<div class="row"><div class="t">${esc(nomP(e, p.id))}${p.invitado ? '<span class="tag">temporal</span>' : ''}</div><div class="m">${v > 0.004 ? 'le deben' : v < -0.004 ? 'debe' : 'a mano'}</div><div class="a num" style="color:${col}">${v > 0.004 ? '+ ' : ''}${fmtE(v, e)}</div></div>`; }).join('');
    const trHtml = tr.length ? tr.map(x => `<div class="tr"><span><strong>${esc(nomP(e, x.de))}</strong> → <strong>${esc(nomP(e, x.a))}</strong></span><span style="display:flex;gap:8px;align-items:center"><span class="num" style="font-weight:600">${fmtE(x.monto, e)}</span>${abierto ? `<button class="btn ok" data-act="evliq" data-id="${e.id}" data-de="${x.de}" data-a="${x.a}" data-v="${x.monto}">Saldado</button>` : ''}</span></div>`).join('') : '<p class="empty">Están todos a mano.</p>';
    const libres = PERS().filter(x => !parts.some(p => p.id === x.id));
    cuerpo = `<div class="grid4">${tile('Total', fmtE(total, e), `${gs.length} ${gs.length === 1 ? 'gasto' : 'gastos'}`)}${tile('Pagaste vos', fmtE(gs.filter(m => !m.ajeno).reduce((a, m) => a + enEv(m, e), 0), e), 'está en tus gastos')}${tile(yo >= 0 ? 'Te deben' : 'Debés', fmtE(Math.abs(yo), e), '', yo < -0.004)}${tile('Personas', String(parts.length), parts.some(p => p.invitado) ? 'con invitados temporales' : '')}</div>
    ${lista('Gastos', gs, 'Todavía no hay gastos.', `<button class="btn via" data-act="evadd" data-id="${e.id}">+ Gasto</button>`)}
    <section class="panel"><h2>Participantes <span>${parts.length}</span></h2>
      <div class="chips">${parts.map(p => `<span class="ptc">${esc(p.id === 'yo' ? miNombre() + ' (vos)' : p.nombre)}${p.invitado ? '<span class="tag">temporal</span>' : ''}${p.id === 'yo' || !abierto ? '' : `<button type="button" data-act="evpartdel" data-id="${e.id}" data-pid="${p.id}" aria-label="Quitar a ${esc(p.nombre)}">✕</button>`}</span>`).join('')}</div>
      ${abierto && libres.length ? `<div class="chips" style="margin-top:8px">${libres.map(x => `<button type="button" class="chip" data-act="evpartadd" data-id="${e.id}" data-c="${x.id}">+ ${esc(x.nombre)}</button>`).join('')}</div>` : ''}
      ${e.grupo ? `<p class="note" style="margin:8px 0 0">Compartida por Google Drive con ${esc(Object.values(e.grupo.mapa || {}).filter(id => id !== 'yo').map(id => nomPer(id)).join(', '))}: cada uno carga lo suyo y se ve en todas las apps.</p>`
        : personasVinculadas().some(x => evCompartible(e, x.id)) ? `<p class="note" style="margin:8px 0 0">Se comparte con ${esc(personasVinculadas().filter(x => evCompartible(e, x.id)).map(x => x.nombre).join(', '))} por el archivo que ya tienen.</p>`
        : ofreceGrupo(e) && abierto ? `<div class="chips" style="margin-top:8px;align-items:center"><button class="btn" data-act="evgrupo" data-id="${e.id}">Compartir por correo</button><span class="note">Le llega a ${esc(conCorreo(e).map(p => nomPer(p.id)).join(' y '))} para que lo vean y carguen en su app.</span></div>` : ''}
      ${abierto ? `<div class="filters" style="margin-top:8px"><input class="inp" id="ev-inv" placeholder="Nombre de un invitado" autocomplete="off" style="flex:1;max-width:none"><button class="btn" data-act="evinv" data-id="${e.id}">Agregar invitado temporal</button></div>
      <p class="note" style="margin:6px 0 0">Un invitado temporal existe solo en esta salida; no se agrega a tus Personas.</p>` : ''}</section>
    <section class="panel"><h2>Quién le debe a quién</h2><div class="list">${balHtml}</div>
      <h3 class="label" style="margin:14px 0 8px">Para quedar a mano · ${tr.length} ${tr.length === 1 ? 'pago' : 'pagos'}</h3><div style="display:grid;gap:6px">${trHtml}</div>

  }

  <section class="panel trip"><h1 style="font-size:24px">${icoEv(e)}${esc(e.nombre)}</h1>
    <p class="note" style="margin:0">${rangoEv(e)} · ${viaje ? 'viaje' : 'comida o salida'} en ${esc(MON(e.moneda).nombre.toLowerCase())}</p></section>
  ${cuerpo}
  <section class="panel"><h2>Resumen para WhatsApp</h2>

  <div class="filters">${abierto ? `<button class="btn" data-act="evcerrar" data-id="${e.id}">Archivar</button>` : `<button class="btn" data-act="evreabrir" data-id="${e.id}">Reabrir</button>`}<button class="btn danger" data-act="evdel" data-id="${e.id}">Borrar ${viaje ? 'viaje' : 'salida'}</button></div>
  <p class="note">${viaje ? 'Borrar el viaje borra lo pagado con viáticos. Lo demás (viáticos cargados, gastos con tarjeta o cuenta) queda en tus movimientos, sin el viaje.' : 'Borrar la salida deja en tus movimientos lo que pagaste vos y borra lo que pagaron otros.'}</p>`;

// ---------- Hoja: gasto de una comida o salida ----------
function abrirEvGasto(e, m, re){
  if (!e) return;
  if (!re){
    if (!S.cfg.cuentas.length){ toast('Primero agregá una cuenta en Ajustes'); return; }
    E = m ? {id:m.id, ev:e.id, montoTxt:dec(m.monto), moneda:m.moneda, concepto:m.concepto || '', cat:m.cat, pagador:m.pagador || 'yo', medio: m.tarjeta ? 't:' + m.tarjeta : 'c:' + (m.cuenta || cuentaDefecto()), division:[...(m.division || ['yo'])], fecha:m.fecha}
      : {id:null, ev:e.id, montoTxt:'', moneda:e.moneda, concepto:'', cat: CAT('Alimentación') ? 'Alimentación' : catDefecto(), pagador:'yo', medio:'c:' + cuentaDefecto(), division:(e.participantes || []).map(p => p.id), fecha: hoy() < e.desde || hoy() > (e.hasta || e.desde) ? e.desde : hoy()};
  }
  const parts = e.participantes || [];
  const opts = S.cfg.cuentas.map(c => ['c:' + c.id, c.nombre]).concat(S.cfg.tarjetas.map(t => ['t:' + t.id, t.nombre]));
  const ms = E.pagador === 'yo' ? monedasDe(E.medio.slice(0, 1) === 't' ? 't' : 'c', E.medio.slice(2)) : [...new Set([e.moneda, monP().id])];
  if (!ms.includes(E.moneda)) E.moneda = ms.includes(e.moneda) ? e.moneda : ms.includes(monP().id) ? monP().id : ms[0];
  $('#overlay').innerHTML = `<div class="scrim" data-act="close"><form class="sheet${re ? '' : ' anim'}" id="gsheet" role="dialog" aria-modal="true" aria-label="Gasto de ${esc(e.nombre)}" novalidate>
    <header><h3>${icoEv(e)}${E.id ? 'Editar gasto' : 'Gasto'} · ${esc(e.nombre)}</h3><button type="button" class="iconbtn" data-act="close" aria-label="Cerrar">${chev('M6 6l12 12M18 6L6 18')}</button></header>
    <div class="amount"><button type="button" data-act="evmon" aria-label="Cambiar moneda"${ms.length < 2 ? ' tabindex="-1"' : ''}>${esc(monLbl(E.moneda))}</button><input id="e-monto" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(E.montoTxt)}" aria-label="Monto"></div>
    <div class="field"><span class="label">Categoría</span>${chipsDe('e', 'cat', CATS().map(c => [c.id, c.nombre]), E.cat)}</div>
    <div class="field"><label for="e-concepto">En qué</label><input class="inp" id="e-concepto" autocomplete="off" value="${esc(E.concepto)}" placeholder="Carne, bebida, postre…"></div>
    <div class="field"><span class="label">¿Quién pagó?</span>${chipsDe('e', 'pagador', parts.map(p => [p.id, p.id === 'yo' ? 'Yo' : p.nombre]), E.pagador)}</div>
    ${E.pagador === 'yo' ? `<div class="field"><span class="label">Pagado con</span>${chipsDe('e', 'medio', opts, E.medio)}</div>` : ''}
    <div class="field"><span class="label">Dividir en partes iguales entre</span><div class="chips">${parts.map(p => `<button type="button" class="chip" data-e="div" data-v="${p.id}" aria-pressed="${E.division.includes(p.id)}">${esc(p.id === 'yo' ? 'Yo' : p.nombre)}</button>`).join('')}</div><span class="note num" id="e-parte"></span></div>
    <div class="field"><label for="e-fecha">Fecha</label><input class="inp" id="e-fecha" type="date" min="${inicio()}-01" value="${E.fecha}"></div>
    <p class="note" style="margin:0;padding:10px 12px;border-radius:10px;background:var(--viaje-soft);color:var(--ink)">${E.pagador === 'yo' ? 'Lo pagaste vos: aparece en tus gastos como siempre. Lo que les toca a los demás queda para saldar en la salida.' : `Lo pagó ${esc(nomP(e, E.pagador))}: no aparece en tus gastos, solo en esta salida.`}</p>
    <div class="actions">${E.id ? '<button type="button" class="btn danger" data-act="evgdel">Borrar</button>' : ''}<button type="submit" class="btn primary">Guardar</button></div>
  </form></div>`;
  updEv();
  if (!re && !E.id) setTimeout(() => $('#e-monto')?.focus(), 60);
}
function leerEv(){ E.montoTxt = $('#e-monto')?.value ?? E.montoTxt; E.concepto = $('#e-concepto')?.value ?? E.concepto; E.fecha = $('#e-fecha')?.value || E.fecha; }
function updEv(){
  const pe = $('#e-parte'); if (!pe || !E) return;
  const n = parseNum($('#e-monto')?.value), nd = E.division.length;
  pe.textContent = isFinite(n) && n > 0 && nd ? `${fmtEn(n / nd, E.moneda)} cada uno${E.division.includes('yo') ? '' : ' · a vos no te toca'}` : '';
}
async function enviarEvGasto(){
  leerEv(); const e = EV(E.ev); if (!e) return;
  const monto = parseNum(E.montoTxt);
  if (!isFinite(monto) || monto <= 0){ toast('Escribí un monto mayor a cero'); $('#e-monto')?.focus(); return; }
  if (!E.division.length){ toast('Elegí entre quiénes se divide'); return; }
  if (!E.fecha){ toast('Elegí una fecha'); return; }
  const yo = E.pagador === 'yo', tp = E.medio.slice(0, 1), mid = E.medio.slice(2), card = yo && tp === 't';
  const prev = E.id ? S.movs.find(m => m.id === E.id) : null;
  const data = {fecha:E.fecha, tipo:'gasto', cat:E.cat, concepto: E.concepto.trim() || nomCat(E.cat), monto, moneda:E.moneda,
    tasa: esPpal(E.moneda) ? 1 : (prev && prev.moneda === E.moneda && prev.tasa ? prev.tasa : tasaDe(E.moneda)),
    cuenta: yo && !card ? mid : null, tarjeta: card ? mid : null, cuotas:1, estado:'pagado', nota: prev?.nota || '', plantilla:null, creado: prev?.creado || Date.now(),
    evento:e.id, pagador:E.pagador, division:[...E.division], ajeno:!yo};
  if (card) data.mesResumen = mesResumen({...data, mesResumen:null});
  const msg = yo ? `Gasto en ${e.nombre}: está en tus gastos` : `Gasto de ${nomP(e, E.pagador)} en ${e.nombre}: solo en la salida`;
  if (await guardar(E.id, data)){ cerrar(); toast(msg); }
}

// ---------- Hoja: nuevo viaje o salida, y editar ----------
function abrirEvento(tipo, re, ed){
  if (ed) V = {id:ed.id, edit:true, tipo:ed.tipo, nombre:ed.nombre, desde:ed.desde, hasta:ed.hasta || '', moneda:ed.moneda, presTxt: ed.presupuesto ? dec(ed.presupuesto) : '', parts:[], invitados:[], invTxt:''};
  else if (!re){

  const liq = VC.kind === 'liq', mio = liq || VC.quien === 'yo', sale = mio && VC.dest !== 'v' && !(liq && VC.dir === 'recibi');
  // Que no quede en negativo una moneda que la cuenta no tiene: se propone comprarla con la principal, o cargar en la principal

async function guardarLiq(e, de, a, monto, cuenta){

      monto:mm, moneda:mon, tasa: esPpal(mon) ? 1 : tasaDe(mon), cuenta, tarjeta:null, cuotas:1, estado:'pagado', nota:'', plantilla:null, creado:Date.now(), evento:e.id, liq:l.id});

async function borrarEvento(e){

    if (m.ajeno || m.viatico) await S.db.collection(COL.movs).doc(m.id).delete(); // lo pagado con viáticos vive solo en el viaje (la plata ya salió al cargar los viáticos)
    else await S.db.collection(COL.movs).doc(m.id).update({evento:null, fase:null, pagador:null, division:null, ajeno:null, liq:null, carga:null});
  }
  await S.db.collection('eventos').doc(e.id).delete();

  if (a === 'evvolver' || a === 'navev'){ S.evSel = null; if (location.hash === '#eventos') render(); return true; }
  if (a === 'evmes'){ S.evMes = t.dataset.mk || null; render(); return true; }

  if (a === 'evsaldar'){ abrirViatico(EV(t.dataset.ev), null, {pid:t.dataset.pid, v:t.dataset.v}); return true; }
  if (a === 'vcok' && VC){ t.disabled = true; await guardarVC(); t.disabled = false; return true; }
  if (a === 'vccambio' && VC){ t.disabled = true; await guardarVC('cambio'); t.disabled = false; return true; }
  if (a === 'vcenpesos' && VC){ await guardarVC('enpesos'); return true; }
  if (a === 'vcdel' && VC){ if (!armar(t)) return true; if (await borrar(COL.movs, VC.id)){ cerrar(); toast('Borrado'); } return true; }
  if (a === 'vcmon' && VC){ leerVC(); const e2 = EV(VC.ev), ms = VC.dest === 'v' || (VC.kind === 'carga' && VC.quien !== 'yo') ? S.cfg.monedas.map(x => x.id) : monedasDe('c', VC.dest); VC.moneda = ms[(ms.indexOf(VC.moneda) + 1) % ms.length]; VC.falta = null; abrirViatico(e2, null, null, true); return true; }

  if (a === 'evedit' && e){ abrirEvento(e.tipo, false, e); return true; }
  if (a === 'evmon' && E){ leerEv(); const ev = EV(E.ev), ms = E.pagador === 'yo' ? monedasDe(E.medio.slice(0, 1) === 't' ? 't' : 'c', E.medio.slice(2)) : [...new Set([ev.moneda, monP().id])]; E.moneda = ms[(ms.indexOf(E.moneda) + 1) % ms.length]; abrirEvGasto(ev, null, true); return true; }
  if (a === 'evgdel' && E){ if (!armar(t)) return true; if (await borrar(COL.movs, E.id)){ cerrar(); toast('Gasto borrado'); } return true; }
  if (a === 'vinv' && V){ leerV(); const n = V.invTxt.trim(); if (!n){ toast('Escribí un nombre'); $('#v-inv')?.focus(); return true; } V.invitados.push({id:genId('g'), nombre:n, invitado:true}); V.invTxt = ''; abrirEvento(null, true); $('#v-inv')?.focus(); return true; }

  if (a === 'cmpshare'){ try { await navigator.share({text: S.textoCompartir || ''}); } catch(e){} return; }
  if (a === 'estquitar'){ const q = {...(S.cfg.estQuitados || {})}; q[claveEst(S.mes, t.dataset.tj, t.dataset.mon || monP().id)] = true;
    if (await guardarCfg({estQuitados: q})){ if (F) cerrar(); render(); toast(`Pago estimado de ${nomTj(t.dataset.tj)} quitado`); } return; }
  if (a === 'estvolver'){ const q = {...(S.cfg.estQuitados || {})}; for (const k of Object.keys(q)) if (k.startsWith(S.mes + '|')) delete q[k]; if (await guardarCfg({estQuitados: q})){ render(); toast('Estimados visibles de nuevo'); } return; }
  if (a === 'pagoest'){ const tid = t.dataset.tj, mon = t.dataset.mon || monP().id; const c = TJ(tid)?.cuentaPago; nuevoForm({tipo:'pago', tarjeta:tid, cuenta: c && monedasDe('c', c).includes(mon) ? c : (S.cfg.cuentas.find(x => x.tipo !== 'ahorro' && x.monedas.includes(mon)) || {}).id || c || cuentaDefecto(), moneda:mon, monto:+t.dataset.v, estRef:{tid, mon}}); return; }
  if (a === 'plantnew'){ abrirPlant(null); return; }
  if (a === 'plantedit'){ const p = S.plant.find(x => x.id === t.dataset.id); if (p) abrirPlant(p); return; }
  if (a === 'ctanew'){ abrirCuenta(null); return; }
  if (a === 'ctaedit'){ const c = CTA(t.dataset.id); if (c) abrirCuenta(c); return; }
  if (a === 'tjnew'){ abrirTarjeta(null); return; }
  if (a === 'tjedit'){ const x = TJ(t.dataset.id); if (x) abrirTarjeta(x); return; }
  if (a === 'monnew'){ abrirMoneda(null); return; }
  if (a === 'monedit'){ const m = S.cfg.monedas.find(x => x.id === t.dataset.id); if (m) abrirMoneda(m); return; }
  if (a === 'moncap'){ if (await guardarCfg({monedaCapital: t.dataset.id})) render(); return; }
  if (a === 'pres'){ const v = parseNum($('#c-pres').value); if (!isFinite(v) || v < 0){ toast('Escribí un monto válido'); return; } if (await guardarCfg({presupuesto:v})){ render(); toast('Presupuesto guardado'); } return; }
  if (a === 'fechasaldos'){ const f = $('#s-fecha').value; if (!f){ toast('Elegí una fecha'); return; } if (await guardarCfg({fechaSaldos:f})){ render(); toast('Fecha guardada'); } return; }
  if (a === 'csv'){ exportar(); return; }
  if (a === 'driveconectar'){ conectarDrive(); return; }
  if (a === 'drivesync'){ sincronizarConToque(); return; }
  if (a === 'actualizarapp'){ // trae y sube lo de Drive, busca la versión nueva de la app y recarga
    if (t.classList.contains('girando')) return; t.classList.add('girando');
    try {
      if (driveConectado()){ if (!tokenValido()) await pedirToken(''); await sincronizar(true); }
    } catch(e){ toast('No se pudo sincronizar con Drive. Igual se actualiza la app.'); }
    try { const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch(e){}
    setTimeout(() => location.reload(), 400); return; }
  if (a === 'drivedesc'){ if (!armar(t)) return; desconectarDrive(); return; }
  if (a === 'respaldo'){ exportarCopia(); return; }
  if (a === 'importar'){ const f = $('#imp-file'); if (f){ f.value = ''; f.click(); } else { location.hash = '#ajustes'; } return; }
  if (a === 'impok'){ aplicarImport(t); return; }
  if (a === 'modo'){ cambiarModo(t.dataset.v); return; }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const id = ev.target.id;
  if (id === 'sheet') enviarForm(); else if (id === 'psheet') enviarPlant(); else if (id === 'msheet') enviarMover();
  else if (id === 'ksheet') enviarCuenta(); else if (id === 'esheet') enviarPersona(); else if (id === 'tsheet') enviarTarjeta(); else if (id === 'osheet') enviarMoneda(); else if (id === 'catsheet') enviarCat(); else if (id === 'subsheet') enviarSub();
  else if (id === 'gsheet') enviarEvGasto(); else if (id === 'vsheet') enviarEvento();
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'f-compensa' && F){ leerForm(); abrirHoja(true); return; }
  if (ev.target.id === 'f-comp' && F){
    leerForm();
    if (ev.target.checked){ F.splitOpen = true; F.splitModo = F.splitModo || 'div'; if (PERS().length === 1){ F.split = {con:[PERS()[0].id], pagador:'yo', partes:{}, modo:F.splitModo}; partesIguales(); } }
    else { F.split = null; F.splitOpen = false; if (!F.tarjeta) F.cuotas = 1; }
    abrirHoja(true); return;
  } if (ev.target.id === 'imp-file' && ev.target.files && ev.target.files[0]) leerCopia(ev.target.files[0]); });
document.addEventListener('input', ev => {
  if (ev.target.id === 'f-monto') actualizarConv();
  if (ev.target.id === 'e-monto' && E) updEv();
  if (F && F.split && (ev.target.id === 'f-pt-rng' || ev.target.dataset.parte)){
    const ins = [...document.querySelectorAll('[data-parte]')];
    if (ev.target.id === 'f-pt-rng'){ const v = +ev.target.value; ins.forEach(i => i.value = dec(i.dataset.parte === 'yo' ? v : 100 - v)); }
    else if (ins.length >= 2){
      // Lo que escribiste queda fijo; los que no tocaste se reparten en partes iguales lo que falta para 100
      const k = ev.target.dataset.parte, ed = (F.split.editados || []).filter(x => x !== k && ins.some(i => i.dataset.parte === x)); ed.push(k);
      while (ed.length > ins.length - 1) ed.shift(); // siempre queda al menos uno que se calcula solo
      F.split.editados = ed;
      const fijo = x => ed.includes(x), val = i => Math.min(100, Math.max(0, parseNum(i.value) || 0));
      const libres = ins.filter(i => !fijo(i.dataset.parte)), resto = Math.max(0, 100 - ins.filter(i => fijo(i.dataset.parte)).reduce((a, i) => a + val(i), 0));
      const q = Math.floor(resto * 100 / libres.length) / 100;
      libres.forEach((i, n) => i.value = dec(n === libres.length - 1 ? Math.round((resto - q * (libres.length - 1)) * 100) / 100 : q));
      const rg = $('#f-pt-rng'), yoI = ins.find(i => i.dataset.parte === 'yo'); if (rg && yoI) rg.value = val(yoI);
    }
    const yo = ins.find(i => i.dataset.parte === 'yo'), ot = ins.find(i => i.dataset.parte !== 'yo');
    if ($('#f-pt-yo') && yo) $('#f-pt-yo').textContent = yo.value + ' %'; if ($('#f-pt-otro') && ot) $('#f-pt-otro').textContent = ot.value + ' %';
    leerForm(); pintarSplit();
  }
  if (ev.target.id === 'm-monto' || ev.target.id === 'm-montoA') convMover();
  if (ev.target.id === 'f-fecha' && F){ leerForm(); abrirHoja(true); }
  if (ev.target.id === 'q'){ S.q = ev.target.value; const pos = ev.target.selectionStart; render(); const q = $('#q'); if (q){ q.focus(); q.setSelectionRange(pos,pos); } }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#overlay').innerHTML) cerrar(); });
// Teclado en el celular: medir cuánto tapa y llevar el campo activo a la vista
const vv = window.visualViewport;
function medirTeclado(){ if (!vv) return; const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); document.documentElement.style.setProperty('--kb', (kb > 80 ? kb : 0) + 'px'); }
if (vv){ vv.addEventListener('resize', medirTeclado); vv.addEventListener('scroll', medirTeclado); }
let tecladoT;
document.addEventListener('focusin', ev => {
  const el = ev.target, sh = el.closest && el.closest('.sheet');
  if (!sh || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.type === 'checkbox') return;
  clearTimeout(tecladoT); sh.classList.add('teclado');
  setTimeout(() => { medirTeclado(); el.scrollIntoView({block:'center', behavior:'smooth'}); }, 320);
});
document.addEventListener('focusout', ev => {
  const sh = ev.target.closest && ev.target.closest('.sheet'); if (!sh) return;
  tecladoT = setTimeout(() => { if (!sh.contains(document.activeElement)) sh.classList.remove('teclado'); medirTeclado(); }, 250);
});
$('#fab').addEventListener('click', () => nuevoForm());
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => S.view === 'analisis' && render());
new MutationObserver(() => S.view === 'analisis' && render()).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

// Al redibujar un formulario abierto (tocar flechas, chips, etc.) se mantiene donde estabas
let scrollHoja = null;
$('#overlay').addEventListener('scroll', ev => { const t = ev.target; if (t && t.classList && t.classList.contains('sheet')) scrollHoja = {id: t.id, top: t.scrollTop}; }, true);
new MutationObserver(() => {
  const sh = $('#overlay .sheet');
  if (!sh) { scrollHoja = null; return; }
  if (sh.classList.contains('anim')) scrollHoja = null;
  else if (scrollHoja && scrollHoja.id === sh.id) sh.scrollTop = scrollHoja.top;
  mostrarElegidos($('#overlay'));
}).observe($('#overlay'), {childList:true});
boot();
})();
